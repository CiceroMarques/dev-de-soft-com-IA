services:
  mysql:
    image: mysql:8.0
    container_name: reserve-me-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reserve_me
      MYSQL_USER: reserve_me_user
      MYSQL_PASSWORD: reserve_me_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ../schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro

volumes:
  mysql_data:
