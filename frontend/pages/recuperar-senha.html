<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#05060E" />
    <title>Recuperar senha | Reserve.me</title>
    <link rel="stylesheet" href="../styles/styles.css" />
    <script src="../scripts/script.js" defer></script>
  </head>
  <body>
    <main class="page">
      <section class="login recovery" aria-labelledby="brand recovery-title">
        <h1 class="brand" id="brand">
          Reserve<span>.</span>me
        </h1>

        <h2 class="screen-title" id="recovery-title">Recuperar senha</h2>
        <p class="screen-description">Informe seu email para recuperar o acesso.</p>

        <form class="login-form validated-form" data-auth-form="forgot-password" novalidate>
          <div class="field">
            <p class="field-error" id="recovery-email-error" aria-live="polite"></p>
            <input
              id="recovery-email"
              name="email"
              type="email"
              placeholder="Email"
              autocomplete="email"
              class="required-field"
              aria-required="true"
              aria-describedby="recovery-email-error"
              aria-invalid="false"
            />
          </div>

          <p class="form-required-message" aria-live="polite"></p>
          <p class="form-response-message" role="status" aria-live="polite"></p>
          <button class="submit-button" type="submit">Enviar</button>
          <a class="recovery-link" href="index.html">Voltar para entrar</a>
        </form>
      </section>

      <footer class="footer">
        <a href="termos-privacidade.html#termos">Termos de uso</a>
        <span aria-hidden="true">·</span>
        <a href="termos-privacidade.html#privacidade">Privacidade</a>
      </footer>
    </main>
  </body>
</html>
